# docker-compose.yml
version: '3.8'

services:
  attendance-app:
    build: .
    container_name: attendance-backend
    ports:
      - "8000:8000"  # Same as your local
    environment:
      # Your current environment
      SQLITE_DB_PATH: /app/data/attendance.db
      SECRET_KEY: your-secret-key-change-in-production
      ENVIRONMENT: production
      DEBUG: "false"
      ALLOWED_ORIGINS: "*"
      
      # WhatsApp/SMS config (from your logs)
      FAST2SMS_API_KEY: "GjYSIu5N9E...z9rTdjqEaf"  # Your key
      WHATSAPP_PHONE_NUMBER_ID: "994096853778961"
      WHATSAPP_API_VERSION: "v22.0"
      
    volumes:
      # Mount data folder to persist SQLite database
      - ./data:/app/data
      
      # Optional: mount logs
      - ./logs:/app/logs
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3